[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "../horizon-client/src/android_main.rs"
crate-type = ["cdylib"]

[dependencies]
horizon-client-render = { path = "../horizon-client-render" }
horizon-chat-filter = { path = "../horizon-chat-filter" }
horizon-narrator = { path = "../horizon-narrator" }
horizon-client-input = { path = "../horizon-client-input" }
horizon-anticheat = { path = "../horizon-anticheat" }
horizon-client = { path = "../horizon-client", default-features = false }
# The cdylib compiles its own copy of gameplay, so it needs the voice engine directly.
voicechat_engine = { path = "../voicechat-engine" }
# Upstream's split engine crates, used by the shared gameplay/Android host glue.
horizon-hooks = { path = "../horizon-hooks" }
horizon-cosmetics = { path = "../horizon-cosmetics" }
horizon-client-core = { path = "../horizon-client-core" }
horizon-perf-format = { path = "../horizon-perf-format" }
# launcher/src/worlds.rs and server_list.rs read level.dat / servers.dat through
# horizon-platform's NBT view, so the Android cdylib needs the `world` feature too.
horizon-platform = { path = "../horizon-platform", features = ["world"] }
horizon-system = { path = "../horizon-system" }
horizon-optifine = { path = "../horizon-optifine" }
chacha20poly1305 = "0.10"
toml = "1.1"
android_logger = "0.15"
regex = "1"
# launcher/src/i18n.rs asks the OS for the player's locale.
sys-locale = "0.3"
horizon-hdr = { path = "../horizon-hdr" }
horizon-shader-api = { path = "../horizon-shader-api" }
jni = "0.21"
getrandom = "0.3"
url = "2"
horizon-assets = { path = "../horizon-assets" }
horizon-port-pack = { path = "../horizon-port-pack" }
sha1 = "0.10"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
horizon-core = { path = "../horizon-core" }
horizon-items = { path = "../horizon-items" }
# The server thread ahead of the workers (MinecraftServer.spin's Thread.setPriority).
horizon-threads = { path = "../horizon-threads" }
horizon-world = { path = "../horizon-world" }
horizon-protocol = { path = "../horizon-protocol" }
# server.properties, eula.txt and the user lists, shared with horizon-server.
horizon-server-files = { path = "../horizon-server-files" }
horizon-shaders = { path = "../horizon-shaders" }
horizon-friends = { path = "../horizon-friends" }
# Native mod discovery shares the upstream index. Java mods are not supported.
horizon-mods = { path = "../horizon-mods", default-features = false, features = ["index"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = { version = "0.30.13", features = ["android-native-activity"] }
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
png = "0.18"
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# servers.dat stores a server's 64x64 PNG as base64 (launcher/src/server_list.rs).
base64 = "0.22"
# hlsl-out: the gfx.rs tests translate every shader as wgpu's DirectX 12 backend does. A normal feature,
# not a dev-dependency's, so builds, tests and examples share one build of naga, wgpu and this crate.
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
# Sound (ALSA on Linux); the `audio` feature. Voice chat needs cpal capture on Android.
cpal = { version = "0.16", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
miniz_oxide = "0.8"
ab_glyph = "0.2.32"
log = "0.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
horizon-theme = { path = "../horizon-theme" }
# Opt-in data collection: the game keeps, the launcher sends (docs/telemetry.md); `live` is
# the anonymous "I'm playing" ping the game sends itself (`heartbeat.rs`).
horizon-telemetry = { path = "../horizon-telemetry", default-features = false, features = ["live"] }
horizon-bench = { path = "../horizon-bench" }
# Match horizon-client-lib's zip: the shared world-management source passes its ZipWriter here.
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# Controllers (evdev + libudev on Linux, IOKit on macOS, Windows.Gaming.Input); the `controllers` feature.
# The DualSense's rumble, adaptive triggers and lights over HID (gilrs only reads it).
# HTTPS to the Minecraft services (online-mode session join).

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time", "fs"] }

[features]
default = ["mods", "audio"]
audio = ["horizon-client/audio", "horizon-client-render/audio", "dep:cpal"]
controllers = []
mods = ["horizon-client/mods", "horizon-mods/runtime"]
# Shared gameplay source gates these; Android intentionally keeps them off.
# Declaring them here makes the `cfg(feature = "...")` checks in game.rs known
# to the cdylib build instead of reporting an unexpected `cfg` condition value.
friends = []
horizon-extras = []

[lints]
workspace = true
