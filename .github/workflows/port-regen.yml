name: Horizon 26.4 — Regenerate version-dependent tables
run-name: Regenerate 26.4 tables on ${{ github.ref_name }}

# The Android build's prepare stage produces vanilla's data-generator reports, which are the
# authoritative source for packet ids. This job runs that prepare stage and commits the
# regenerated Rust table back to the dispatched branch. It never opens a pull request.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: port-regen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: '0'
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - name: Check out the dispatched branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 25 for the vanilla data generator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare the pinned Minecraft version and its reports
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"

      - name: Regenerate the packet-id table
        run: |
          set -euo pipefail
          python3 tools/generate_packet_ids.py
          rustfmt --edition 2024 crates/horizon-protocol/src/ids.rs
          git diff --stat -- crates/horizon-protocol/src/ids.rs

      - name: Commit and push the regenerated table
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/horizon-protocol/src/ids.rs; then
            echo "packet-id table unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/horizon-protocol/src/ids.rs
          git commit -m "Regenerate packet ids from 26.4-snapshot-10 data-generator reports [skip ci]"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Upload the regeneration log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: port-regen-log-${{ github.run_number }}
          path: .local/horizon-client/**/*export.log
          if-no-files-found: ignore
