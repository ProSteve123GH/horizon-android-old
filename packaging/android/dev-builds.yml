name: Android dev APKs
run-name: Android dev · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - android
      - 'android-dev*'
      - 'dev/android-*'
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'research-lock.json'
      - 'packaging/android/**'
      - 'tools/**'
      - 'mods/**'
      - 'third_party/**'
      - '.github/workflows/android-dev.yml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      all_abis:
        description: Also build ARMv7, x86 and x86_64
        type: boolean
        default: false
      profile:
        description: Rust optimization profile
        type: choice
        options:
          - release
          - fast
        default: release

permissions:
  contents: read
concurrency:
  group: android-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pull requests never receive the maintainer's signing secret. Branch builds
    # and dispatches do; an absent secret falls back to a cached dev key.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/android' || startsWith(github.ref, 'refs/heads/dev/android-') || startsWith(github.ref, 'refs/heads/android-dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.all_abis && '["arm64-v8a","armeabi-v7a","x86","x86_64"]' || '["arm64-v8a"]') }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
      PROFILE: ${{ inputs.profile || 'release' }}
      NDK_VERSION: '28.2.13676358'
      BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 25 for Mojang exporters
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Record the exporter JDK
        run: echo "JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 17 for Gradle and Android
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Record the Gradle JDK
        run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'

      - name: Install Android SDK, NDK and Rust target
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-36' \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"
          rustup show
          case "$ABI" in
            arm64-v8a) target=aarch64-linux-android ;;
            armeabi-v7a) target=armv7-linux-androideabi ;;
            x86) target=i686-linux-android ;;
            x86_64) target=x86_64-linux-android ;;
          esac
          rustup target add "$target"

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: android-cargo-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            android-cargo-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Cache prepared Minecraft inputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .local/android/minecraft
            .local/horizon-client
            .local/android/serve
          key: android-minecraft-${{ hashFiles('research-lock.json', 'tools/android_prepare.py', 'tools/lab.py') }}
          restore-keys: |
            android-minecraft-

      - name: Restore cached fallback dev key
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/dev-signing
          key: horizon-dev-signing-v1
          restore-keys: |
            horizon-dev-signing-

      - name: Restore or create the dev signing key
        id: signing
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key=.local/dev-signing/debug.keystore
          mkdir -p .local/dev-signing
          if [[ -n "${DEV_KEYSTORE:-}" ]]; then
            python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('.local/dev-signing/debug.keystore')
          path.write_bytes(base64.b64decode(os.environ['DEV_KEYSTORE'], validate=True))
          path.chmod(0o600)
          PY
            echo "source=repository secret" >> "$GITHUB_OUTPUT"
          elif [[ -f "$key" ]]; then
            echo "source=restored dev key cache" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -keystore "$key" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -validity 10000 \
              -dname "CN=Horizon Android Dev CI"
            echo "source=newly generated dev key" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p .local/android
          cp "$key" .local/android/debug.keystore
          chmod 0600 .local/android/debug.keystore

      - name: Save the generated fallback dev key
        if: steps.signing.outputs.source == 'newly generated dev key'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/dev-signing
          key: horizon-dev-signing-v1

      - name: Check public source and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'

      - name: Prepare private engine inputs from official downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA25_HOME"

      - name: Build dev APK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 tools/android_build.py --abi "$ABI" --public --profile "$PROFILE" \
            --sdk "$ANDROID_HOME" --java-home "$JAVA17_HOME" --gradle "$(command -v gradle)" \
            --ndk-version "$NDK_VERSION" --build-tools-version "$BUILD_TOOLS_VERSION" \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"

      - name: Collect APK, checksum and build information
        env:
          ABI: ${{ matrix.abi }}
          SIGNING: ${{ steps.signing.outputs.source }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path('dist')
          out.mkdir()
          sha, abi = os.environ['GITHUB_SHA'], os.environ['ABI']
          name = f'Horizon-Android-dev.{os.environ["GITHUB_RUN_NUMBER"]}.{sha[:12]}-{abi}.apk'
          apk = out / name
          shutil.copyfile(Path('.local/android/apk') / abi / 'horizon-android-public.apk', apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(f'{digest}  {name}\n')
          for source, dest in [('LICENSE', 'LICENSE.txt'), ('THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_NOTICES.md')]:
              shutil.copyfile(source, out / dest)
          (out / 'BUILD.json').write_text(json.dumps({
              'commit': sha,
              'branch': os.environ['GITHUB_REF_NAME'],
              'abi': abi,
              'profile': os.environ['PROFILE'],
              'package': 'dev.horizon.android.dev',
              'version_code': 1000 + int(os.environ['GITHUB_RUN_NUMBER']),
              'experimental': True,
              'signing': os.environ['SIGNING'],
              'built_at': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'workflow_run': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
          }, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(
                  f'### Dev APK: {abi}\n\n'
                  f'Commit: `{sha[:12]}` on `{os.environ["GITHUB_REF_NAME"]}`. '
                  f'Profile: `{os.environ["PROFILE"]}`. Signing: {os.environ["SIGNING"]}.\n\n'
                  f'SHA-256: `{digest}`\n\n'
                  'Download the APK artifact below. It installs separately from the release app '
                  'as `dev.horizon.android.dev`; worlds and accounts are not copied automatically.\n')
          PY
          # Convert the version code to the exact APK identity for the log.
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt2" dump badging \
            "dist/$(ls dist | grep '\.apk$')" | head -3

      - name: Upload dev APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-dev-${{ github.run_number }}-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove decoded signing material from the workspace
        if: always()
        run: |
          rm -f .local/android/debug.keystore
          rm -rf .local/dev-signing
