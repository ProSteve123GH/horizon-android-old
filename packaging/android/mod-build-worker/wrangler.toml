# Horizon Android's native mod builds on GitHub's machines (docs/android-native-mods.md).
# Deploy: `wrangler kv namespace create STORE`, put its id below, `wrangler secret put
# GITHUB_TOKEN`, `wrangler deploy`. The launcher already names this fork's deployed Worker; set its
# Build server to the URL it prints to use yours.
name = "horizon-mod-builds"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

[[kv_namespaces]]
binding = "STORE"
id = "2d9d17a700ea4bf9baace93dfaf6e498"

[vars]
# The repository made from packaging/android/mod-builds/ (owner/name).
GITHUB_REPO = "ProSteve123GH/horizon-mod-builds"
# Its workflow, and the branch that holds it.
GITHUB_WORKFLOW = "build.yml"
GITHUB_REF = "main"
# Builds a day, everyone's together and each player's. GitHub's machines are free, but a repository
# that keeps them busy all day may be asked to stop.
PER_DAY = "40"
PER_ADDRESS = "16"
